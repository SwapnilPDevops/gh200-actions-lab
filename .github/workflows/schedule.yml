name: Scheduled Workflow

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 9 * * 1-5'
      timezone: 'Asia/kolkata'

  workflow_dispatch:

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"